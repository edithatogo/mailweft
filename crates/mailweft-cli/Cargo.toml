[package]
name = "mailweft-cli"
version = "0.7.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Offline EML to OCEL 2.0 JSON command-line interface"

[dependencies]
serde = { version = "1", features = ["derive"] }
mailweft-core = { path = "../mailweft-core" }
chrono = "0.4"
serde_json = "1"
clap = { version = "=4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

[[bin]]
name = "mailweft"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
