[package]
name = "mailweft-cli"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Offline EML to OCEL 2.0 JSON command-line interface"

[dependencies]
serde = { version = "1", features = ["derive"] }
mailweft-core = { path = "../mailweft-core" }
chrono = "0.4"
serde_json = "1"

[[bin]]
name = "mailweft"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
