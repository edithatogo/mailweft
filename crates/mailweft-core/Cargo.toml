[package]
name = "mailweft-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Offline Rust email-to-OCEL 2.0 conversion with evidence-preserving source semantics"

[dependencies]
mail-parser = "=1.0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
