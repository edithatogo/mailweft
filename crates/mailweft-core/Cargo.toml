[package]
name = "mailweft-core"
version = "0.8.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Offline Rust email-to-OCEL 2.0 conversion with evidence-preserving source semantics"

[dependencies]
mail-parser = "=1.0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[features]
default = []
rust4pm-validation = ["dep:process_mining"]
rust4pm-sqlite-validation = ["rust4pm-validation", "process_mining/ocel-sqlite"]

[dependencies.process_mining]
version = "=0.6.2"
git = "https://github.com/edithatogo/rust4pm.git"
rev = "7d8d72a139196deb170de7d6442b7c3df6512315"
default-features = false
optional = true

[dev-dependencies]
tempfile = "3"
proptest = "=1.12.0"
