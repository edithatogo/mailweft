[workspace]
members = ["crates/mailweft-core", "crates/mailweft-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/edithatogo/mailweft"

[workspace.dependencies]
mail-parser = { version = "=1.0.1", default-features = false }
process_mining = { version = "=0.6.2", default-features = false }
chrono = { version = "=0.4.42", default-features = false, features = ["std", "serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
hmac = "=0.12.1"
clap = { version = "=4.5.51", features = ["derive"] }
tempfile = "=3.23.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
