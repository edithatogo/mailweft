name: One-time batch format and lock
on:
  push:
    branches: [feat/multi-eml-batch]
    paths: ['.github/workflows/batch-format-lock.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'edithatogo/mailweft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable generate-lockfile
      - run: cargo +stable fmt --all
      - name: Commit formatted Rust and lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'style: format batch converter and lock dependencies'
            git push origin HEAD:feat/multi-eml-batch
          fi
