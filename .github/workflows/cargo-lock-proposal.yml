name: Temporary Cargo lockfile proposal
on:
  push:
    branches: [feat/clap-cli-compat-20261113]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Resolve exact Cargo lockfile diff (no source changes or pushes)
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          echo "CARGO_LOCK_PROPOSAL_BEGIN"
          git diff --no-ext-diff -- Cargo.lock
          echo "CARGO_LOCK_PROPOSAL_END"
          sha256sum Cargo.lock
