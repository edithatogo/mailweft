name: One-time attachment Rust format and lock
on:
  push:
    branches: [feat/mime-attachment-metadata]
    paths: ['.github/workflows/attachment-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'edithatogo/mailweft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable generate-lockfile
      - run: cargo +stable fmt --all
      - name: Commit deterministic formatting and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/ Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m 'style: format MIME metadata conversion and lock versions'
            git push origin HEAD:feat/mime-attachment-metadata
          fi
