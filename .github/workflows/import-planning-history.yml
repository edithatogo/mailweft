name: Import verified planning history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-planning-history.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mailweft-history-publication
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'edithatogo/mailweft' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SOURCE_HEAD: 5adfc5a777040fe33c64c4fb860f8fd071c2e790
      SOURCE_TREE: 8b99bbfb69b3e0847f524a202cae6af14c7051e1
      PATCHED_TREE: 56af9e4fb410d284b39cbcf08c3fcda611653879
      CONDUCTOR_SHA: 7a5c560a4fdf5297be58594cc37527eb12790272
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify transport and import immutable source history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, pathlib, subprocess
          expected = [
              'c193dda7e0d6a789d1029c3b5635fb5710c531bf36b0843a47e6de3a4753f287',
              'b5a721cac11e5a4fd2f766cc962b14f562fca85a7170dc6e5a60342bba7e4f2d',
              '6182bc2d83b2a271fc156fde0ea61a200ccf8092b9256463e18952d8209e9143',
              '30bbeb13508be0147516bc7ac551d4937c99de02a88dc343009ce3a5d319fb6e',
              '94cec757b5a2c9813b7abc1fca8f429eff5516fad16914b73db830531a74b0ba',
              '4ccede497893edcfe21ce038a48cc4ff1994a8c9a911cb51f3b5ee8759d358aa',
              '2a631c3464b25cbcdb561b5ad56fcf4fa583d20071d416b44ea47d5d28ce6196',
              'a61d971950a99b2ab41c4e2d6857a6c81e26660f5c73fbd2e9fa03ab61fe7b17',
              '4150d7279da0b7a6364f2f2f48b151b550c61f66599e631b08a410533f6fac21',
          ]
          parts = []
          for i, digest in enumerate(expected):
              path = pathlib.Path(f'.bootstrap/history-{i:02}.b64')
              data = path.read_bytes()
              actual = hashlib.sha256(data).hexdigest()
              if actual != digest:
                  raise SystemExit(f'Transport part {i:02} hash mismatch: {actual}')
              parts.append(data.strip())
          compressed = base64.b64decode(b''.join(parts), validate=True)
          if len(compressed) != 104768 or hashlib.sha256(compressed).hexdigest() != 'ddaf79040f269c1fc5e3e2e03d87d12027bb3cecb97cf33a9008f0606bb018c6':
              raise SystemExit('Compressed source integrity mismatch')
          source = lzma.decompress(compressed)
          if len(source) != 1608573 or hashlib.sha256(source).hexdigest() != '00dadb3327b091d5eb2b5397423d20a997b8160321152c187b3ee588b40119c0':
              raise SystemExit('Source history integrity mismatch')
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mailweft-import'
          dest.mkdir(exist_ok=False)
          subprocess.run(['git', 'init', '-q', str(dest)], check=True)
          subprocess.run(['git', '-C', str(dest), 'fast-import', '--quiet'], input=source, check=True)
          for rev, value in [('refs/heads/main', os.environ['SOURCE_HEAD']), ('refs/heads/main^{tree}', os.environ['SOURCE_TREE'])]:
              actual = subprocess.check_output(['git', '-C', str(dest), 'rev-parse', rev], text=True).strip()
              if actual != value:
                  raise SystemExit(f'Imported {rev} mismatch: {actual}')
          subprocess.run(['git', '-C', str(dest), 'checkout', '-q', 'main'], check=True)
          subprocess.run(['git', '-C', str(dest), 'fsck', '--full'], check=True)
          print('Verified all nine transport parts and preserved source commit/tree identities.')
          patch = pathlib.Path('.bootstrap/qualification.patch').read_bytes()
          if hashlib.sha256(patch).hexdigest() != '6db4c198a1f0dcde5f312963574f553714794a293823de15f87b8285312d0f90':
              raise SystemExit('Qualification patch integrity mismatch')
          subprocess.run(['git', '-C', str(dest), 'apply', '--index', '-'], input=patch, check=True)
          tree = subprocess.check_output(['git', '-C', str(dest), 'write-tree'], text=True).strip()
          if tree != os.environ['PATCHED_TREE']:
              raise SystemExit(f'Qualification tree mismatch: {tree}')
          subprocess.run(['git', '-C', str(dest), '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix: qualify clean-host date-time validation and record partner handoffs'], check=True)
          head = subprocess.check_output(['git', '-C', str(dest), 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'QUALIFIED_HEAD={head}\n')
          print(f'Qualification patch applied; source history retained. Qualified head: {head}')
          PY
      - name: Verify pinned Conductor source checkout
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mailweft-import"
          test "$(git ls-tree HEAD .agents/plugins/conductor | awk '{print $1}')" = 160000
          test "$(git ls-tree HEAD .agents/plugins/conductor | awk '{print $3}')" = "$CONDUCTOR_SHA"
          git submodule update --init --recursive
          test "$(git -C .agents/plugins/conductor rev-parse HEAD)" = "$CONDUCTOR_SHA"
      - name: Verify planning and contracts before publication
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mailweft-import"
          python3 -m pip install --disable-pip-version-check -r requirements-planning.txt
          python3 scripts/validate_scaffold.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_contract_examples.py
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Publish a non-forced merge preserving both histories
        shell: bash
        run: |
          set -euo pipefail
          git fetch "$RUNNER_TEMP/mailweft-import" refs/heads/main:refs/remotes/imported/main
          test "$(git rev-parse refs/remotes/imported/main)" = "$QUALIFIED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Retain unchanged bootstrap workflows. The connected publisher removes
          # them afterwards; this token does not change workflow definitions.
          export GIT_INDEX_FILE="$RUNNER_TEMP/mailweft-publication.index"
          git read-tree "$PATCHED_TREE"
          for path in .github/workflows/publication-preflight.yml .github/workflows/import-planning-history.yml; do
            blob=$(git rev-parse "$GITHUB_SHA:$path")
            git update-index --add --cacheinfo "100644,$blob,$path"
          done
          tree=$(git write-tree)
          unset GIT_INDEX_FILE
          test "$(git rev-parse "$GITHUB_SHA:.github/workflows/planning-checks.yml")" = "$(git rev-parse "$QUALIFIED_HEAD:.github/workflows/planning-checks.yml")"
          merge=$(printf 'Import verified Mailweft planning history and qualification fix\n\nOriginal source: %s\nQualified source: %s\nQualified tree: %s\nPlanning checks and pinned Conductor checkout passed. No application implementation certified.\n' "$SOURCE_HEAD" "$QUALIFIED_HEAD" "$PATCHED_TREE" | git commit-tree "$tree" -p "$GITHUB_SHA" -p "$QUALIFIED_HEAD")
          current=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$current" = "$GITHUB_SHA"
          git push origin "$merge:refs/heads/main"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$merge"
          {
            echo '## Verified Mailweft publication'
            echo "Published merge: $merge"
            echo "Preserved source: $SOURCE_HEAD"
            echo "Qualified source: $QUALIFIED_HEAD"
            echo "Qualified tree: $PATCHED_TREE"
            echo "Conductor checkout: $CONDUCTOR_SHA"
            echo 'Planning checks passed: 53 requirements, 15 tracks, 116 tasks; 17 validator tests; 11 schemas, four positive and 18 negative cases.'
            echo 'Transient bootstrap workflows remain for connected-publisher cleanup. No Rust converter or live processing was executed.'
          } >> "$GITHUB_STEP_SUMMARY"
