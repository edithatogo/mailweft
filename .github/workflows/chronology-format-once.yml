name: One-time chronology rustfmt
on:
  push:
    branches: [feat/claimed-header-chronology]
    paths: ['.github/workflows/chronology-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'edithatogo/mailweft'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --all
      - name: Commit formatting only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/
          if ! git diff --cached --quiet; then
            git commit -m 'style: format claimed header evidence conversion'
            git push origin HEAD:feat/claimed-header-chronology
          fi

# Final formatting after independent Rust4PM attribute round-trip test.
