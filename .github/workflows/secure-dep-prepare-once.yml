name: One-time Rust4PM compatibility and lock qualification
on:
  push:
    branches: [feat/quality-ocel-secure-rust4pm]
    paths: ['.github/workflows/secure-dep-prepare-once.yml']
permissions:
  contents: write
jobs:
  pin:
    if: github.repository == 'edithatogo/mailweft'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Regenerate lock and independently compile patched Rust4PM
        run: |
          cargo generate-lockfile
          cargo check --workspace --all-features
          cargo test -p mailweft-core --features rust4pm-validation --test rust4pm_interop
          cargo fmt --all -- --check
      - name: Commit verified dependency resolution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --quiet || (git commit -m 'chore: lock patched Rust4PM 0.6.2 with quick-xml 0.41' && git push origin HEAD:feat/quality-ocel-secure-rust4pm)
