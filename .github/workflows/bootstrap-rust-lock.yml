name: Qualify feature-branch Rust formatting
on:
  push:
    branches: ['feat/raw-email-ocel']
    paths: ['.github/workflows/bootstrap-rust-lock.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'edithatogo/mailweft' && github.ref == 'refs/heads/feat/raw-email-ocel'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Format additional hardening tests on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all
          if ! git diff --quiet -- crates; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates
            git commit -m 'style: format chronology and security regression tests'
            test "$(git ls-remote origin refs/heads/feat/raw-email-ocel | cut -f1)" = "$GITHUB_SHA"
            git push origin HEAD:refs/heads/feat/raw-email-ocel
          fi
      - name: Observe adversarial and chronology tests
        run: cargo test --quiet --workspace --all-targets --locked --no-fail-fast
