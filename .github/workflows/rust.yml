name: Rust core
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Compile and test locked graph
        run: cargo test --quiet --workspace --all-targets --locked --no-fail-fast
      - name: Format and clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --quiet --workspace --all-targets --locked -- -D warnings
      - name: Cross-check real CLI output with evidence schemas
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-planning.txt
          python3 scripts/check_runtime_schema.py
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Pin audit tool and run licence, source and advisory policy
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo install cargo-deny --version 0.20.2 --locked --quiet
          cargo deny --locked check advisories bans licenses sources
