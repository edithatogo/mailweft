name: One-time corpus and Conductor qualification
on:
  push:
    branches: [feat/corpus-mapping-conductor]
    paths: ['.github/workflows/qualify-corpus-once.yml']
permissions:
  contents: write
jobs:
  qualify:
    if: github.repository == 'edithatogo/mailweft' && github.ref == 'refs/heads/feat/corpus-mapping-conductor'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
          persist-credentials: true
      - name: Prepare explicit source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/qualify_current_slice.py')
          s = p.read_text()
          s = s.replace("    if before in text:\n", "    if after in text:\n        return\n    if before in text:\n", 1)
          s = s.replace("['cargo', 'metadata', '--locked', '--all-features', '--format-version', '1']", "['cargo', 'metadata', '--all-features', '--format-version', '1']")
          s = s.replace('''        let transfer_map = crate::transfer_map::verified_map(
                      part.raw_body(), decoded.as_ref(), text.as_bytes(), start,
                      part.content_transfer_encoding().unwrap_or(""),
                      !problems.is_empty() || !transfer_problems.is_empty() || ambiguous_encoding,
                      remaining_map_units,
                  );''', '''        let transfer_map = crate::transfer_map::verified_map(
                      crate::transfer_map::TransferInput {
                          raw: part.raw_body(), decoded: decoded.as_ref(), text: text.as_bytes(), base: start,
                          encoding: part.content_transfer_encoding().unwrap_or(""),
                          problems: !problems.is_empty() || !transfer_problems.is_empty() || ambiguous_encoding,
                      }, remaining_map_units,
                  );''')
          # The multiline source fragment has independent indentation inside a Python string.
          old = '''            part.raw_body(), decoded.as_ref(), text.as_bytes(), start,
                      part.content_transfer_encoding().unwrap_or(""),
                      !problems.is_empty() || !transfer_problems.is_empty() || ambiguous_encoding,
                      remaining_map_units,'''
          # Exact replacement below is whitespace-independent and asserted.
          marker = 'part.raw_body(), decoded.as_ref(), text.as_bytes(), start,'
          if marker in s:
              begin = s.index(marker)
              end = s.index('remaining_map_units,', begin) + len('remaining_map_units,')
              s = s[:begin] + '''crate::transfer_map::TransferInput {
                      raw: part.raw_body(), decoded: decoded.as_ref(), text: text.as_bytes(), base: start,
                      encoding: part.content_transfer_encoding().unwrap_or(""),
                      problems: !problems.is_empty() || !transfer_problems.is_empty() || ambiguous_encoding,
                  }, remaining_map_units,''' + s[end:]
          p.write_text(s)
          p = Path('crates/mailweft-core/src/transfer_map.rs')
          s = p.read_text()
          old = "pub fn verified_map(raw: &[u8], decoded: &[u8], text: &[u8], base: usize, encoding: &str, problems: bool, budget: usize) -> TransferMap {"
          new = "pub struct TransferInput<'a> { pub raw: &'a [u8], pub decoded: &'a [u8], pub text: &'a [u8], pub base: usize, pub encoding: &'a str, pub problems: bool }\n\npub fn verified_map(input: TransferInput<'_>, budget: usize) -> TransferMap {\n    let TransferInput { raw, decoded, text, base, encoding, problems } = input;"
          assert old in s
          p.write_text(s.replace(old, new).replace('tokens.len() % 4 != 0', '!tokens.len().is_multiple_of(4)'))
          PY
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          python3 scripts/qualify_current_slice.py
          cargo fmt --all
      - name: Qualify runtime and actual-output contracts
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-planning.txt
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo test --locked -p mailweft-core --features rust4pm-validation --test rust4pm_interop
          cargo build --locked -p mailweft-cli
          python3 scripts/validate_runtime_contracts.py
          python3 scripts/validate_selection_outputs.py
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Qualify and reconcile Conductor acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_scaffold.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_contract_examples.py
          python3 scripts/conductor_doctor.py --check
          git check-ignore -q private-example.eml
          git check-ignore -q private-example.pst
          MAILWEFT_QUALIFIED=1 python3 scripts/qualify_current_slice.py --accept
          python3 scripts/conductor_doctor.py --check
          python3 scripts/validate_scaffold.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          git diff --check
      - name: Commit only tested source and generated project context
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/corpus-mapping-conductor | awk '{print $1}')" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates Cargo.lock conductor docs contracts scripts
          if ! git diff --cached --quiet; then
            git commit -m 'chore: qualify corpus mapping, pin workspace 0.7 and reconcile Conductor state'
            git push origin HEAD:feat/corpus-mapping-conductor
          fi
