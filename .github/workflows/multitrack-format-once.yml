name: One-time multitrack Rust formatter
on:
  push:
    branches: [feat/multitrack-evidence-benchmarks]
    paths: ['.github/workflows/multitrack-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: true
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --all
      - name: Commit only Rust formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/
          if ! git diff --cached --quiet; then
            git commit -m 'style: rustfmt capability and loss ledger'
            git push origin HEAD:feat/multitrack-evidence-benchmarks
          fi
